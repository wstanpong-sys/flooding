name: live-update-and-deploy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch iTIC flood reports
        continue-on-error: true
        run: python3 scripts/fetch_itic.py data/itic.json
      - name: Fetch BMA sensors via ThaiWater
        continue-on-error: true
        run: python3 scripts/fetch_sensors.py data/sensors.json
      - name: Build page
        env:
          TZ: Asia/Bangkok
        run: python3 scripts/build_live.py data/itic.json site data/sensors.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
